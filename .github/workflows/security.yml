name: Security

on:
  push:
    branches: [main]
    paths: &security_paths
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".mise.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths: *security_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2.87.27
        with:
          tool: cargo-deny
      # Inert unless a wasmtime advisory waiver is re-added to deny.toml; it
      # pins what such a waiver would actually cover (see crates/xtask/src/wasmtime_lock.rs).
      - name: Guard wasmtime lockfile waiver
        run: cargo run -q -p xtask -- check-wasmtime-lock
      - name: Run cargo-deny
        run: cargo deny check

  cargo-audit:
    name: Advisory Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2.87.27
        with:
          tool: cargo-audit
      # Inert unless a wasmtime advisory waiver is re-added to deny.toml; it
      # pins what such a waiver would actually cover (see crates/xtask/src/wasmtime_lock.rs).
      - name: Guard wasmtime lockfile waiver
        run: cargo run -q -p xtask -- check-wasmtime-lock
      - name: Run cargo-audit
        # Ignore list must mirror deny.toml [advisories].ignore. 0141 is the
        # unmaintained-bincode advisory (transitive via yara-x, informational
        # only). The wasmtime and zstd waivers that used to live here are gone:
        # `zip` moved to 9.x, the wasmtime `cache` feature was dropped
        # (ADR-0043), and `cargo update` lifted both wasmtime copies above
        # every published fix version.
        run: cargo audit --ignore RUSTSEC-2025-0141
