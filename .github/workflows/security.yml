name: Security

on:
  push:
    branches: [main]
    paths: &security_paths
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".mise.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths: *security_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: Dependency Policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8  # v2.87.5
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  cargo-audit:
    name: Advisory Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8  # v2.87.5
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        # Ignore list must mirror deny.toml [advisories].ignore. 0141 is the
        # unmaintained-bincode advisory (transitive via yara-x); 0222/0269
        # apply to the yara-x-pinned wasmtime 43.0.2 copy (see deny.toml
        # comments for the upstream tracking rationale).
        run: cargo audit --ignore RUSTSEC-2025-0141 --ignore RUSTSEC-2026-0222 --ignore RUSTSEC-2026-0269
