name: Agent Skills

# The single home for the agent-skill shell gate.
#
# `code.yml` is Rust/Cargo-scoped, so a diff that only touches `.agents/**`
# never reaches a Rust-scoped workflow and the skill shell suites never
# execute (arbsec/arbitraitor#859). This workflow covers that hole, and it is
# the ONLY workflow that runs the suites: one gate, one set of suites, no
# duplicated CI cost on a mixed diff.
#
# The job reports as `Agent Skills Tests` so the check name stays stable for
# every consumer of `[checks].required` in the project config. Two workflows
# reporting the same check name would collide on a mixed Rust + `.agents` diff,
# so exactly ONE workflow may carry it.
#
# `.github/workflows/**` is in the filter because the suites assert against the
# workflow files themselves: the PATH_GATED table in `scripts/pr-checks` is
# checked against every workflow's trigger paths, so a change to any workflow
# file can invalidate that table. Without this path, a workflow-file-only diff
# would never run the suites and the table could drift unnoticed.
#
# The path filter is spelled out twice on purpose. A YAML anchor/alias pair
# (`paths: &agents_paths` / `paths: *agents_paths`) is valid and GitHub Actions
# accepts it, but actionlint cannot resolve the alias and reports
#   "paths section must be sequence node but got alias node"
# as a syntax error. The qlty linter runs actionlint over changed lines, so the
# alias made this workflow the one check that qlty reported a blocking issue on.
# See arbsec/arbitraitor#865 for the same pattern in the older workflows.
on:
  push:
    branches: [main]
    paths:
      - ".agents/**"
      - ".github/workflows/agents.yml"
      - ".shellcheckrc"
      - ".github/workflows/**"
  pull_request:
    paths:
      - ".agents/**"
      - ".github/workflows/agents.yml"
      - ".shellcheckrc"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-skill-suites:
    name: Agent Skills Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax-check agent skill scripts
        shell: bash
        run: |
          # `bash -n a b` parses only `a`, so each file is checked on its own.
          failed=0
          while IFS= read -r script; do
            if ! bash -n "$script"; then
              printf 'syntax error: %s\n' "$script" >&2
              failed=1
            fi
          done < <(
            # Every shell file under .agents/ — *.sh and *.bash, any depth.
            find .agents -type f \( -name '*.sh' -o -name '*.bash' \) -print
            # Every extensionless script under .agents/skills/*/scripts/. An
            # executable-bit filter would miss the scripts git tracks as
            # 100644 (commit-identity, pr-review-local).
            find .agents/skills -type f -path '*/scripts/*' ! -name '*.*' -print
          )
          exit "$failed"
      # ShellCheck v0.11.0. The release is NOT immutable upstream
      # (`immutable: false`) and publishes no `sha256sums.txt`; the pinned hash
      # below is the Releases-API asset `digest` for
      # shellcheck-v0.11.0.linux.x86_64.tar.xz, so this is trust-on-first-use
      # with a pinned artifact hash — not a signature. A checksum-pinned
      # tarball is used instead of a third-party action: no action SHA to
      # trust, and the binary is verified before it runs.
      - name: Install shellcheck
        shell: bash
        env:
          # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          # Download, verify and unpack under $RUNNER_TEMP so the checkout
          # stays clean (the tarball and its extracted directory are
          # discarded with the runner).
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 120 \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -xf "$archive"
          mkdir -p bin
          install -m 0755 "./shellcheck-${SHELLCHECK_VERSION}/shellcheck" "bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # `-S warning` on purpose: SC2155 (`export X="$(cmd)"` masking the exit
      # status) is a *warning*, and it reached two PRs (#854, #857) before this
      # gate existed. `-S error` would reproduce that hole.
      - name: Shellcheck agent skill scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          # Every shell file under .agents/ (*.sh and *.bash, any depth) plus
          # every extensionless script under .agents/skills/*/scripts/.
          # `-type f` skips the `_lib.sh` symlink (the real file is linted once
          # under github-project-workflow); do not add `-L` — it would select
          # the symlink too and double-lint.
          mapfile -t files < <(
            {
              find .agents -type f \( -name '*.sh' -o -name '*.bash' \) -print
              find .agents/skills -type f -path '*/scripts/*' ! -name '*.*' -print
            } | sort
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no shell files selected"
            exit 1
          fi
          echo "linting ${#files[@]} files"
          shellcheck -x -P SCRIPTDIR -S warning "${files[@]}"
      - name: Run agent skill test suites
        shell: bash
        run: |
          status=0
          for suite in .agents/skills/*/scripts/tests/*.bash; do
            if output="$(bash "$suite" 2>&1)"; then rc=0; else rc=$?; fi
            passes="$(printf '%s\n' "$output" | grep -c '^PASS ' || true)"
            fails="$(printf '%s\n' "$output" | grep -c '^FAIL ' || true)"
            printf '%s\n' "$output"
            printf '%s: %s passed, %s failed (exit %s)\n' "$suite" "$passes" "$fails" "$rc"
            if [ "$rc" -ne 0 ] || [ "$fails" -ne 0 ]; then status=1; fi
          done
          exit "$status"
