name: Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "rumdl.toml"
      - "lefthook.yml"
      - ".mise.toml"
      - ".github/workflows/markdown.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "rumdl.toml"
      - "lefthook.yml"
      - ".mise.toml"
      - ".github/workflows/markdown.yml"

permissions:
  contents: read

concurrency:
  group: markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      - name: Lint markdown
        run: rumdl check .

  book-build:
    name: Book Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32  # v2.88.0
        with:
          tool: mdbook,mdbook-mermaid
      - name: Copy ADRs to book
        run: mkdir -p book/src/adr && cp -r docs/adr/* book/src/adr/
      - name: Build book
        run: mdbook build book

  docs-check:
    name: Docs Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d  # v5.2.4
      - name: Check ADR consistency
        run: cargo run -p xtask -- docs-check
