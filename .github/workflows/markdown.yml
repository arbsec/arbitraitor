name: Markdown

on:
  push:
    branches: [main]
    paths: &md_paths
      - "**/*.md"
      - "rumdl.toml"
      - "lefthook.yml"
      - ".mise.toml"
      - ".github/workflows/markdown.yml"
  pull_request:
    paths: *md_paths

permissions:
  contents: read

concurrency:
  group: markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Lint markdown
        run: rumdl check .

  book-build:
    name: Book Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b  # v2.87.4
        with:
          tool: mdbook,mdbook-mermaid
      - name: Copy ADRs to book
        run: mkdir -p book/src/adr && cp -r docs/adr/* book/src/adr/
      - name: Build book
        run: mdbook build book

  docs-check:
    name: Docs Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4.3.0
      - name: Check ADR consistency
        run: cargo run -p xtask -- docs-check
