name: Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "rumdl.toml"
      - "lefthook.yml"
      - ".mise.toml"
      - ".github/workflows/markdown.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "rumdl.toml"
      - "lefthook.yml"
      - ".mise.toml"
      - ".github/workflows/markdown.yml"

permissions:
  contents: read

concurrency:
  group: markdown-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Lint markdown
        run: rumdl check .

  book-build:
    name: Book Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f  # v2.90.6
        with:
          tool: mdbook,mdbook-mermaid
      - name: Copy ADRs to book
        run: mkdir -p book/src/adr && cp -r docs/adr/* book/src/adr/
      - name: Build book
        run: mdbook build book

  docs-check:
    name: Docs Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d  # v5.2.9
      - name: Check ADR consistency
        run: cargo run -p xtask -- docs-check
