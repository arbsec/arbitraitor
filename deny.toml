# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# The ignore list is reserved for advisories that have been formally evaluated
# and accepted; it carries exactly one entry today. Every wasmtime and zstd
# waiver that used to live here is gone: `zip` moved to 9.x (fixing
# RUSTSEC-2026-0367/0368/0369), the `wasmtime` `cache` feature was dropped
# (ADR-0043) so no `zstd ^0.13` copy remains in the graph, and `cargo update`
# moved both the direct and the yara-x-pinned wasmtime copies above every
# published fix version (direct 49.0.5, yara-x-pinned 48.0.8).
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode 2.0.1 is unmaintained (informational only, no vulnerability recorded). It is a transitive dependency of yara-x and cannot be removed without an upstream yara-x change or a migration to a different YARA runtime. Tracked for resolution when yara-x drops bincode." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
