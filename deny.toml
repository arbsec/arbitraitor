# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# bincode is unmaintained (RUSTSEC-2025-0141, superseded by RUSTSEC-2026-0185).
# It is a transitive dependency via yara-x which we cannot remove without
# upstream changes. Tracked for resolution when yara-x drops bincode or we
# migrate to an alternative YARA runtime.
# RUSTSEC-2026-0222 and RUSTSEC-2026-0269 affect the wasmtime 43.0.2 copy
# pulled in transitively by yara-x 1.19.0 (whose wasmtime requirement is
# ^43.0.2); our direct wasmtime dependency is floored at 47.0.4, which is
# above all fix versions. The 43.x copy cannot be bumped without upstream
# yara-x releasing a version with a newer wasmtime dep (yara-x 1.20.0 still
# pins wasmtime ^45.0.3, inside 0269's affected range).
# RUSTSEC-2026-0316 affects that same yara-x 1.20.0 wasmtime 45.0.3 copy
# (dynamic record lifting can allocate beyond the hostcall fuel limit,
# low severity). No patched 45.x exists — fixes landed in >=36.0.16,
# >=48.0.3, and >=49.0.1 — so it cannot be resolved by cargo update until
# yara-x bumps wasmtime. Same yara-x pin as the high-severity
# RUSTSEC-2026-0269 ignore above.
ignore = [
    "RUSTSEC-2025-0141",
    "RUSTSEC-2026-0222",
    { id = "RUSTSEC-2026-0269", reason = "yara-x 1.19.0 requires wasmtime ^43.0.2, resolving the transitive copy to 43.0.2; no yara-x release with a fixed wasmtime range exists yet (1.20.0 requires wasmtime ^45.0.3, still affected). Our direct wasmtime floor is 47.0.4 (patched). Drop this ignore when yara-x requires a patched wasmtime." },
    { id = "RUSTSEC-2026-0316", reason = "yara-x 1.20.0 requires wasmtime ^45.0.3, resolving the transitive copy to 45.0.3 (dynamic record lifting can allocate beyond the hostcall fuel limit, low severity). No patched 45.x exists — fixes are in >=36.0.16, >=48.0.3, >=49.0.1 — so this is not resolvable by cargo update. High-severity sibling RUSTSEC-2026-0269 for the same yara-x wasmtime pin is already ignored. Drop this ignore when yara-x requires a patched wasmtime." },
    { id = "RUSTSEC-2026-0325", reason = "yara-x 1.20.0 resolves the transitive wasmtime copy to 45.0.3 (mis-typed WebAssembly tag imports can lead to GC heap corruption). No patched 45.x exists — fixes are in >=38.0.7, >=48.0.4, >=49.0.2 — so this is not resolvable by cargo update. Same yara-x wasmtime pin as the ignored RUSTSEC-2026-0269/0316. Drop this ignore when yara-x requires a patched wasmtime." },
    { id = "RUSTSEC-2026-0326", reason = "yara-x 1.20.0 resolves the transitive wasmtime copy to 45.0.3 (rooting for GC values live across try_call may be missing, causing GC heap corruption). No patched 45.x exists — fixes are in >=48.0.4, >=49.0.2 — so this is not resolvable by cargo update. Same yara-x wasmtime pin as the ignored RUSTSEC-2026-0269/0316. Drop this ignore when yara-x requires a patched wasmtime." },
    { id = "RUSTSEC-2026-0327", reason = "yara-x 1.20.0 resolves the transitive wasmtime copy to 45.0.3 (component async-lifted callback result count unvalidated, causing a native stack buffer overflow). No patched 45.x exists — fixes are in >=48.0.4, >=49.0.2 — so this is not resolvable by cargo update. Same yara-x wasmtime pin as the ignored RUSTSEC-2026-0269/0316. Drop this ignore when yara-x requires a patched wasmtime." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8
exceptions = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
